name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test and boot check
    runs-on: ubuntu-latest
    env:
      # Accepts the public development secret; any other environment requires a real one.
      ENVIRONMENT: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check app tests

      - name: Run tests
        run: pytest

      - name: Boot check
        # Importing the app is not enough: the lifespan runs the zero-database isolation guard,
        # so start it through TestClient and hit /health.
        run: |
          python -c "from app.main import app; print(app.title)"
          python - <<'EOF'
          from fastapi.testclient import TestClient

          from app.main import app

          with TestClient(app) as client:
              response = client.get("/health")
              assert response.status_code == 200, response.text
              print(response.json())
          EOF
